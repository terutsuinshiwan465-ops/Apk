<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Розклад</title>

<style>
* { box-sizing: border-box; }

:root {
  --bg: #121110;
  --line: #2b271f;
  --ink: #f2ece1;
  --muted: #94897a;
  --accent: #cf9a52;
  --danger: #b96a52;
}

body {
  margin: 0;
  padding: 28px 20px 48px;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { max-width: 560px; margin: 0 auto; }

.nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
}

.nav-arrow {
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 22px;
  padding: 8px 14px;
  cursor: pointer;
  line-height: 1;
}

.nav-arrow:active { color: var(--ink); }

.day-col {
  flex: 1;
  text-align: center;
}

.day-name {
  font-size: 15px;
  font-weight: 500;
}

.day-name.is-today {
  color: var(--accent);
}

.day-name .qualifier {
  color: var(--muted);
  font-weight: 400;
}

.today-line {
  margin-top: 3px;
  font-size: 11.5px;
  color: var(--muted);
}

.rule {
  border: none;
  border-top: 1px solid var(--line);
  margin: 0;
}

.status { padding: 20px 0 22px; }

.status-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}

.status-main {
  font-family: Georgia, 'Noto Serif', 'Times New Roman', serif;
  font-weight: 500;
  font-size: 27px;
  line-height: 1.25;
  letter-spacing: -0.2px;
}

.status-meta {
  margin-top: 5px;
  font-size: 13px;
  color: var(--muted);
}

.status-timer {
  margin-top: 10px;
  font-size: 13px;
  color: var(--accent);
}

.lesson {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 0 14px 12px;
  border-bottom: 1px solid var(--line);
  border-left: 2px solid transparent;
}

.lesson:last-child { border-bottom: none; }

.lesson.active {
  border-left-color: var(--accent);
  background: rgba(207, 154, 82, 0.12);
}
.lesson.active .time { color: var(--accent); }
.lesson.active .lesson-title { font-weight: 600; }

.lesson.editable { cursor: pointer; }
.lesson.editable:active { background: rgba(255,255,255,0.03); }

.time {
  width: 64px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--muted);
}

.lesson-body { flex: 1; min-width: 0; }

.lesson-title {
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.35;
}

.lesson-meta {
  margin-top: 2px;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.3;
}

.edit-hint {
  color: var(--muted);
  font-size: 14px;
  flex-shrink: 0;
  padding-right: 2px;
}

.gap-row {
  text-align: center;
  padding: 11px 0;
  font-size: 12.5px;
  font-style: italic;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}

.empty {
  padding: 40px 0;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

.add-lesson {
  display: block;
  width: 100%;
  text-align: left;
  padding: 14px 2px 2px;
  background: none;
  border: 0;
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
}

.footer-links {
  margin-top: 30px;
  text-align: center;
}

.footer-links button {
  display: block;
  width: 100%;
  margin: 0 auto 8px;
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 12.5px;
  cursor: pointer;
  padding: 6px;
  text-decoration: underline;
  text-decoration-color: var(--line);
  text-underline-offset: 3px;
}

.footer-links button:active {
  color: var(--accent);
  text-decoration-color: var(--accent);
}

.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(8, 7, 6, 0.6);
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}

.modal-backdrop.open { display: flex; }

.modal {
  width: 100%;
  max-width: 560px;
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--line);
  border-bottom: none;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  border-radius: 16px 16px 0 0;
}

.modal-title {
  font-family: Georgia, 'Noto Serif', 'Times New Roman', serif;
  font-size: 19px;
  margin-bottom: 18px;
}

.modal-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.modal-row input[type="time"] {
  flex: 1;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: 14px;
  padding: 8px 2px;
}

.modal-dash { color: var(--muted); }

.modal-field { margin-bottom: 14px; }

.modal-field label {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
  margin-bottom: 5px;
}

.modal-field input[type="text"] {
  display: block;
  width: 100%;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  color: var(--ink);
  font-size: 14.5px;
  padding: 8px 2px;
}

.modal-field input::placeholder { color: var(--muted); }

.import-hint {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.5;
  margin-bottom: 14px;
}

.import-hint code {
  color: var(--ink);
  font-size: 12px;
}

.import-file {
  display: block;
  width: 100%;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 12.5px;
}

.import-textarea {
  display: block;
  width: 100%;
  min-height: 200px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: 12.5px;
  line-height: 1.5;
  padding: 10px;
  margin-bottom: 14px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

.modal-actions-right { display: flex; gap: 8px; }

.modal-delete {
  background: none; border: 0; color: var(--danger); font-size: 13px; cursor: pointer; padding: 8px 4px;
}

.modal-delete[hidden] { display: none; }

.modal-cancel {
  background: none; border: 0; color: var(--muted); font-size: 13px; cursor: pointer; padding: 8px 12px;
}

.modal-save {
  background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 8px 12px;
}

@media (max-width: 380px) {
  body { padding: 22px 16px 40px; }
  .status-main { font-size: 23px; }
  .time { width: 56px; font-size: 11px; }
  .lesson-title { font-size: 13.5px; }
}
</style>
</head>

<body>
<div class="app">

  <div class="nav-row">
    <button class="nav-arrow" onclick="changeDay(-1)">‹</button>
    <div class="day-col">
      <div class="day-name" id="day-display"></div>
      <div class="today-line" id="today-line"></div>
    </div>
    <button class="nav-arrow" onclick="changeDay(1)">›</button>
  </div>

  <hr class="rule">

  <div class="status">
    <div class="status-label" id="status-label">Статус</div>
    <div class="status-main" id="current-status">Завантаження…</div>
    <div class="status-meta" id="status-meta"></div>
    <div class="status-timer" id="timer-status"></div>
  </div>

  <hr class="rule">

  <div id="schedule-list"></div>

  <div class="footer-links">
    <button id="edit-toggle" onclick="toggleEdit()">Редагувати розклад</button>
  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModalIfBackdrop(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Нова пара</div>

    <div class="modal-row">
      <input type="time" id="modal-start">
      <span class="modal-dash">–</span>
      <input type="time" id="modal-end">
    </div>

    <div class="modal-field">
      <label for="modal-subject">Предмет</label>
      <input type="text" id="modal-subject" placeholder="Напр. Українська література">
    </div>

    <div class="modal-field">
      <label for="modal-teacher">Викладач</label>
      <input type="text" id="modal-teacher" placeholder="Необов'язково">
    </div>

    <div class="modal-field">
      <label for="modal-room">Кабінет</label>
      <input type="text" id="modal-room" placeholder="Необов'язково">
    </div>

    <div class="modal-actions">
      <button class="modal-delete" id="modal-delete" onclick="modalDelete()">Видалити</button>
      <div class="modal-actions-right">
        <button class="modal-cancel" onclick="closeModal()">Скасувати</button>
        <button class="modal-save" onclick="modalSave()">Зберегти</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="import-backdrop" onclick="closeImportIfBackdrop(event)">
  <div class="modal">
    <div class="modal-title">Імпорт тижня</div>

    <div class="import-hint">
      Назва дня на окремому рядку (Понеділок, Вівторок…), далі по одному рядку на пару:<br>
      <code>09:40-10:25 | Предмет | Викладач | Кабінет</code><br>
      Викладача й кабінет можна не вказувати. Імпорт замінює весь тижневий розклад.
    </div>

    <input class="import-file" type="file" id="import-file" accept=".txt,text/plain" onchange="handleImportFile(event)">

    <textarea class="import-textarea" id="import-textarea" placeholder="Понеділок
09:00-09:45 | Предмет 1 | Викладач | Кабінет
09:50-10:35 | Предмет 2

Вівторок
09:00-09:45 | Предмет 3"></textarea>

    <div class="modal-actions">
      <div></div>
      <div class="modal-actions-right">
        <button class="modal-cancel" onclick="closeImportModal()">Скасувати</button>
        <button class="modal-save" onclick="applyImport()">Замінити розклад</button>
      </div>
    </div>
  </div>
</div>

<script>

const GAP_THRESHOLD_MIN = 15;
const STORAGE_KEY = "schedule-data-v2";

const days = ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"];
const MONTHS_GENITIVE = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];

const DEFAULT_SCHEDULE = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

let scheduleData = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
let editMode = false;
let modalEditingIndex = null;
let renderedRows = [];

function getRealDayIndex(d) {
  return d.getDay() === 0 ? 6 : d.getDay() - 1;
}

const initialNow = new Date();
let realDayIndex = getRealDayIndex(initialNow);
let selectedDayIndex = realDayIndex;
if (initialNow.getHours() >= 19) {
  selectedDayIndex = (realDayIndex + 1) % 7;
}

function toMinutes(t) {
  const parts = t.split(":").map(Number);
  return parts[0] * 60 + parts[1];
}

function normalizeTime(t) {
  const parts = t.split(":");
  return String(parts[0]).padStart(2, "0") + ":" + String(parts[1]).padStart(2, "0");
}

function lessonDates(lesson, base) {
  const s = lesson.start.split(":").map(Number);
  const e = lesson.end.split(":").map(Number);
  const start = new Date(base);
  start.setHours(s[0], s[1], 0, 0);
  const end = new Date(base);
  end.setHours(e[0], e[1], 0, 0);
  return { start: start, end: end };
}

function sortedLessons(dayIdx) {
  return (scheduleData[dayIdx] || []).slice().sort(function (a, b) {
    return toMinutes(a.start) - toMinutes(b.start);
  });
}

function sortedLessonRefs(dayIdx) {
  return (scheduleData[dayIdx] || []).map(function (lesson, i) {
    return { lesson: lesson, index: i };
  }).sort(function (a, b) {
    return toMinutes(a.lesson.start) - toMinutes(b.lesson.start);
  });
}

function lessonMeta(lesson) {
  return [lesson.teacher, lesson.room].filter(Boolean).join(" · ");
}

function formatTimer(ms) {
  if (ms < 0) ms = 0;
  const seconds = Math.floor(ms / 1000);
  const minutes = Math.floor(seconds / 60);
  const sec = seconds % 60;
  if (minutes >= 60) {
    const hours = Math.floor(minutes / 60);
    const min = minutes % 60;
    return hours + " год " + String(min).padStart(2, "0") + " хв";
  }
  return minutes + " хв " + String(sec).padStart(2, "0") + " сек";
}

function formatDuration(mins) {
  if (mins >= 60) {
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return m ? (h + " год " + m + " хв") : (h + " год");
  }
  return mins + " хв";
}

function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function computeStatusForToday() {
  const currentNow = new Date();
  const todayIdx = getRealDayIndex(currentNow);
  const lessons = sortedLessons(todayIdx);

  let current = null, prev = null, next = null;

  for (let i = 0; i < lessons.length; i++) {
    const lesson = lessons[i];
    const dates = lessonDates(lesson, currentNow);
    if (currentNow >= dates.start && currentNow <= dates.end) {
      current = Object.assign({}, lesson, dates);
      break;
    }
    if (currentNow < dates.start) {
      next = Object.assign({}, lesson, dates);
      break;
    }
    prev = Object.assign({}, lesson, dates);
  }

  return { current: current, prev: prev, next: next, currentNow: currentNow, todayLessonsCount: lessons.length };
}

function setStatusLesson(lessonLike) {
  const main = document.getElementById("current-status");
  const meta = document.getElementById("status-meta");
  main.textContent = lessonLike.subject || "Без назви";
  const m = lessonMeta(lessonLike);
  if (m) {
    meta.textContent = m;
    meta.style.display = "";
  } else {
    meta.textContent = "";
    meta.style.display = "none";
  }
}

function updateLiveStatus() {
  const result = computeStatusForToday();
  const label = document.getElementById("status-label");
  const timer = document.getElementById("timer-status");

  if (result.current) {
    label.textContent = "Зараз";
    setStatusLesson(result.current);
    timer.textContent = "До кінця · " + formatTimer(result.current.end - result.currentNow);
    return;
  }

  if (result.next) {
    const gapMin = result.prev ? Math.round((result.next.start - result.prev.end) / 60000) : null;
    const isWindow = gapMin !== null && gapMin >= GAP_THRESHOLD_MIN;
    label.textContent = isWindow ? "Вікно" : (result.prev ? "Перерва" : "До початку занять");
    setStatusLesson(result.next);
    timer.textContent = "Через · " + formatTimer(result.next.start - result.currentNow);
    return;
  }

  label.textContent = "Статус";
  document.getElementById("current-status").textContent = result.todayLessonsCount ? "Пари закінчились" : "Сьогодні пар немає";
  const meta = document.getElementById("status-meta");
  meta.textContent = "";
  meta.style.display = "none";
  timer.textContent = "";
}

function updateActiveHighlight() {
  const currentNow = new Date();
  const todayIdx = getRealDayIndex(currentNow);
  const isToday = selectedDayIndex === todayIdx;

  renderedRows.forEach(function (row) {
    const active = isToday && currentNow >= row.start && currentNow <= row.end;
    row.el.classList.toggle("active", active);
  });
}

function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7 * 24 * 3600 * 1000));
}

function renderTodayLine() {
  const now = new Date();
  const el = document.getElementById("today-line");
  el.textContent = now.getDate() + " " + MONTHS_GENITIVE[now.getMonth()] + " · " + getISOWeek(now) + "-й тиждень";
}

function tick() {
  updateLiveStatus();
  updateActiveHighlight();
  renderTodayLine();
}

function isShowingTomorrow() {
  const current = new Date();
  const rIdx = getRealDayIndex(current);
  return selectedDayIndex === (rIdx + 1) % 7 && current.getHours() >= 19;
}

function renderDayHeader() {
  const el = document.getElementById("day-display");
  const name = days[selectedDayIndex];
  const isToday = selectedDayIndex === getRealDayIndex(new Date());

  el.classList.toggle("is-today", isToday);

  if (isToday) {
    el.innerHTML = name + ' <span class="qualifier">· сьогодні</span>';
  } else if (isShowingTomorrow()) {
    el.innerHTML = name + ' <span class="qualifier">· завтра</span>';
  } else {
    el.innerHTML = name;
  }
}

function renderSchedule() {
  renderDayHeader();

  const container = document.getElementById("schedule-list");
  container.innerHTML = "";
  renderedRows = [];

  const refs = sortedLessonRefs(selectedDayIndex);

  if (!refs.length && !editMode) {
    container.innerHTML = '<div class="empty">Пар немає</div>';
    return;
  }

  refs.forEach(function (ref, pos) {
    const lesson = ref.lesson;
    const realIdx = ref.index;
    const dates = lessonDates(lesson, new Date());
    const meta = lessonMeta(lesson);

    const durationMin = toMinutes(lesson.end) - toMinutes(lesson.start);
    const blockScale = Math.max(1, durationMin / 45);
    const blockPad = Math.round(14 * blockScale);

    const item = document.createElement("div");
    item.className = "lesson" + (editMode ? " editable" : "");
    item.style.paddingTop = blockPad + "px";
    item.style.paddingBottom = blockPad + "px";
    if (editMode) {
      item.onclick = function () { openModal(realIdx); };
    }
    item.innerHTML =
      '<div class="time">' + lesson.start + "–" + lesson.end + "</div>" +
      '<div class="lesson-body">' +
      '<div class="lesson-title">' + escapeHtml(lesson.subject) + "</div>" +
      (meta ? '<div class="lesson-meta">' + escapeHtml(meta) + "</div>" : "") +
      "</div>" +
      (editMode ? '<div class="edit-hint">✎</div>' : "");
    container.appendChild(item);
    renderedRows.push({ el: item, start: dates.start, end: dates.end });

    const nextRef = refs[pos + 1];
    if (nextRef) {
      const gap = toMinutes(nextRef.lesson.start) - toMinutes(lesson.end);
      if (gap >= GAP_THRESHOLD_MIN) {
        const gapRow = document.createElement("div");
        gapRow.className = "gap-row";
        gapRow.textContent = "Вікно · " + formatDuration(gap);
        container.appendChild(gapRow);
      }
    }
  });

  if (editMode) {
    const addBtn = document.createElement("button");
    addBtn.className = "add-lesson";
    addBtn.textContent = "+ Додати пару";
    addBtn.onclick = function () { openModal(); };
    container.appendChild(addBtn);

    const importBtn = document.createElement("button");
    importBtn.className = "add-lesson";
    importBtn.textContent = "Імпортувати весь тиждень текстом";
    importBtn.onclick = openImportModal;
    container.appendChild(importBtn);
  }

  updateActiveHighlight();
}

function changeDay(direction) {
  selectedDayIndex = (selectedDayIndex + direction + 7) % 7;
  renderSchedule();
}

function toggleEdit() {
  editMode = !editMode;
  document.getElementById("edit-toggle").textContent = editMode ? "Готово" : "Редагувати розклад";
  renderSchedule();
}

function openModal(idx) {
  modalEditingIndex = (typeof idx === "number") ? idx : null;
  const lesson = modalEditingIndex !== null ? scheduleData[selectedDayIndex][modalEditingIndex] : null;

  document.getElementById("modal-title").textContent = lesson ? "Редагувати пару" : "Нова пара";
  document.getElementById("modal-start").value = lesson ? lesson.start : "09:00";
  document.getElementById("modal-end").value = lesson ? lesson.end : "09:45";
  document.getElementById("modal-subject").value = lesson ? lesson.subject : "";
  document.getElementById("modal-teacher").value = lesson ? lesson.teacher : "";
  document.getElementById("modal-room").value = lesson ? lesson.room : "";

  const delBtn = document.getElementById("modal-delete");
  if (lesson) {
    delBtn.removeAttribute("hidden");
  } else {
    delBtn.setAttribute("hidden", "");
  }

  document.getElementById("modal-backdrop").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-backdrop").classList.remove("open");
  modalEditingIndex = null;
}

function closeModalIfBackdrop(e) {
  if (e.target.id === "modal-backdrop") closeModal();
}

function modalSave() {
  const start = document.getElementById("modal-start").value || "09:00";
  const end = document.getElementById("modal-end").value || "09:45";
  const subject = document.getElementById("modal-subject").value.trim() || "Без назви";
  const teacher = document.getElementById("modal-teacher").value.trim();
  const room = document.getElementById("modal-room").value.trim();

  if (!scheduleData[selectedDayIndex]) scheduleData[selectedDayIndex] = [];

  const lesson = { start: start, end: end, subject: subject, teacher: teacher, room: room };

  if (modalEditingIndex !== null) {
    scheduleData[selectedDayIndex][modalEditingIndex] = lesson;
  } else {
    scheduleData[selectedDayIndex].push(lesson);
  }

  saveSchedule();
  closeModal();
  renderSchedule();
  tick();
}

function modalDelete() {
  if (modalEditingIndex === null) return;
  scheduleData[selectedDayIndex].splice(modalEditingIndex, 1);
  saveSchedule();
  closeModal();
  renderSchedule();
  tick();
}

function openImportModal() {
  document.getElementById("import-backdrop").classList.add("open");
}

function closeImportModal() {
  document.getElementById("import-backdrop").classList.remove("open");
}

function closeImportIfBackdrop(e) {
  if (e.target.id === "import-backdrop") closeImportModal();
}

function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function () {
    document.getElementById("import-textarea").value = String(reader.result || "");
  };
  reader.readAsText(file, "UTF-8");
}

function matchDayName(line) {
  const cleaned = line.replace(/^[\s\-•*\d.)]+/, "").trim().toLowerCase();
  for (let i = 0; i < days.length; i++) {
    if (cleaned.indexOf(days[i].toLowerCase()) === 0) return i;
  }
  return null;
}

function parseScheduleText(text) {
  const result = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
  let currentDay = null;

  text.split(/\r?\n/).forEach(function (rawLine) {
    const line = rawLine.trim().replace(/\*\*/g, "").replace(/`/g, "");
    if (!line) return;

    const dayIdx = matchDayName(line);
    if (dayIdx !== null) {
      currentDay = dayIdx;
      return;
    }

    if (currentDay === null) return;

    const timeMatch = line.match(/(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})/);
    if (!timeMatch) return;

    const rest = line.slice(timeMatch.index + timeMatch[0].length);
    const fields = rest.split("|").map(function (p) { return p.trim(); });
    while (fields.length && fields[0] === "") fields.shift();
    while (fields.length && fields[fields.length - 1] === "") fields.pop();

    result[currentDay].push({
      start: normalizeTime(timeMatch[1]),
      end: normalizeTime(timeMatch[2]),
      subject: fields[0] || "Без назви",
      teacher: fields[1] || "",
      room: fields[2] || ""
    });
  });

  return result;
}

function applyImport() {
  const text = document.getElementById("import-textarea").value;
  const parsed = parseScheduleText(text);
  const total = Object.keys(parsed).reduce(function (sum, k) { return sum + parsed[k].length; }, 0);

  if (total === 0) {
    alert("Не вдалося розпізнати жодної пари. Перевірте формат тексту.");
    return;
  }

  scheduleData = parsed;
  saveSchedule();
  closeImportModal();
  renderSchedule();
  tick();
}

function loadSchedule() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      scheduleData = JSON.parse(raw);
    }
  } catch (e) {}
}

function saveSchedule() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scheduleData));
  } catch (e) {}
}

loadSchedule();
renderSchedule();
tick();
setInterval(tick, 1000);

</script>
</body>
